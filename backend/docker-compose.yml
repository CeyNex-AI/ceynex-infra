# CeyNex backend VM. No external IP: only the frontend VM reaches port 8000,
# and only this VM reaches the database VM (gcp/01_firewall_setup.sh).
#
# Expects the three repos checked out as siblings, which is why the build
# context is two levels up:
#
#   ~/ceynex/ceynex-contracts
#   ~/ceynex/ceynex-core
#   ~/ceynex/ceynex-infra      <- run `docker compose` from backend/ in here
#
# `ceynex` is a namespace package split across ceynex-contracts and ceynex-core,
# so the image cannot be built from either repo alone.
services:
  api:
    build:
      context: ../..
      dockerfile: ceynex-infra/backend/Dockerfile
    image: ceynex-api:latest
    container_name: ceynex-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Point at the DATABASE VM's internal IP — not localhost, not the frontend VM.
      POSTGRES_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DATABASE_INTERNAL_IP}:5432/${POSTGRES_DB}
      NEO4J_URI: bolt://${DATABASE_INTERNAL_IP}:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@${DATABASE_INTERNAL_IP}:6379/0

      # Policy-document retrieval (D10). Unset, or CEYNEX_POLICY_RETRIEVAL=off,
      # and PolicyRetriever.from_settings() returns None — trade_economics then
      # answers exactly as it did before the feature existed, which is a
      # supported state rather than a broken one. Requires tcp:6333 on the
      # allow-db-from-backend firewall rule and the image built with `.[policy]`.
      QDRANT_URL: http://${DATABASE_INTERNAL_IP}:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-ceynex_policy}
      CEYNEX_POLICY_RETRIEVAL: ${CEYNEX_POLICY_RETRIEVAL:-on}

      # News sidecar (D11). Its own Qdrant collection on the same server, never
      # ceynex_policy: unvetted headlines behind the policy filters would become
      # citable evidence, and NewsStore refuses to start if the two names match.
      #
      # This is the first thing in the deployment that calls a *public* API.
      # Egress from this VM is fine (github.com and api.openai.com both answer
      # over TLS), but `api.gdeltproject.org` specifically resets every
      # connection to :443 while serving port 80 normally — measured on the box,
      # three attempts, spaced. So the endpoint is overridden to http here.
      #
      # That trade is documented in config/news.yaml and docs/DEFERRED.md: no
      # key, no token and no personal data cross the wire, because this API has
      # none. Drop this line the day :443 starts answering; the default in
      # config/news.yaml is https and needs no change.
      #
      # Re-check with:
      #   docker compose exec api curl -s -o /dev/null -w '%{http_code}\n' \
      #     https://api.gdeltproject.org/api/v2/doc/doc?query=tea
      CEYNEX_GDELT_BASE_URL: ${CEYNEX_GDELT_BASE_URL:-http://api.gdeltproject.org/api/v2/doc/doc}

      QDRANT_NEWS_COLLECTION: ${QDRANT_NEWS_COLLECTION:-ceynex_news}
      CEYNEX_NEWS: ${CEYNEX_NEWS:-on}
      # Separate switch so a second replica can serve the shared trending
      # snapshot without also calling GDELT. Both workers of a single container
      # coordinate through the Redis lock above instead.
      CEYNEX_NEWS_REFRESH: ${CEYNEX_NEWS_REFRESH:-on}

      # SRS 3.1.11. ceynex-core's settings.jwt_secret() falls back to a constant
      # that is committed to the repo, so an unset value here means anyone who
      # can read the source can mint an admin token for the live API. There is
      # no env_file: here -- compose only interpolates ${...} into this block --
      # so a value in .env that is not named below never reaches the container.
      # `:?` therefore refuses to start rather than starting insecurely.
      CEYNEX_JWT_SECRET: ${CEYNEX_JWT_SECRET:?set it in .env - openssl rand -hex 32}

      # RBAC bootstrap. The four fixed demo accounts are gone; a fresh database
      # has zero users and nobody can sign in to become an admin. ceynex-core's
      # users.ensure_table() reads this once at startup and creates the account
      # if it is not already present -- it never overwrites an existing row, so
      # leaving it set across restarts is harmless. Format: email:password.
      # Empty is supported (e.g. once the real admin exists and has changed the
      # password); the account can also be made by hand with
      # `docker compose exec api python -m ceynex.api.users create-admin ...`.
      CEYNEX_BOOTSTRAP_ADMIN: ${CEYNEX_BOOTSTRAP_ADMIN:-}

      # SRS 3.6.5 treats the LLM as a vendor-neutral purchased component; the
      # provider and model ids live in ceynex-core/config/llm.yaml, only the
      # credential lives here. Empty is a supported state — the system degrades
      # to raw KG and model output rather than failing (SRS 3.4.3).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # R5 failsafe (ceynex-core config/llm.yaml `fallback` block): tried once
      # if the primary OpenAI call fails/times out or its daily spend cap is
      # hit. Empty just means the failsafe is unusable, same degrade-don't-fail
      # posture as OPENAI_API_KEY above.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # R2. Empty falls back to the committed bulk CSV extract.
      COMTRADE_API_KEY: ${COMTRADE_API_KEY:-}

      CEYNEX_DATA_DIR: /app/data
      CEYNEX_MODELS_DIR: /app/models
    volumes:
      # Model registry (team overview 4.4: {sector}/{item}/{target}/{version}),
      # the Parquet mirror of fact_trade, and the LLM prompt-hash cache. All
      # rebuildable, but losing them means a retrain before the next demo.
      - models_data:/app/models
      - dataset_data:/app/data
      - llm_cache:/app/.cache
      # D10's ONNX models. Downloaded on first policy query (~400 MB); a volume
      # means that cost is paid once per VM, not once per container start.
      - fastembed_cache:/app/.fastembed
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  models_data:
  dataset_data:
  llm_cache:
  fastembed_cache:
