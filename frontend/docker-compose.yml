services:
  web:
    build:
      context: ../..
      dockerfile: ceynex-infra/frontend/Dockerfile
    image: ceynex-web:latest
    container_name: ceynex-web
    restart: unless-stopped
    environment:
      # Read only by nginx's startup envsubst (nginx.conf.template) to proxy
      # /api -> the backend VM. Never reaches client-side JS, which is what
      # makes this safe as a runtime var -- contrast with a VITE_* var, which
      # would need to be known at `npm run build` time instead (see README.md).
      BACKEND_INTERNAL_IP: ${BACKEND_INTERNAL_IP}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Self-signed for now (no domain yet, see README.md); swap the files in
      # this directory for certbot-issued ones once a domain points here.
      - ./certs:/etc/nginx/certs:ro
    healthcheck:
      # https, self-signed -- --no-check-certificate matches curl -k. 127.0.0.1
      # not localhost: the container's /etc/hosts resolves localhost to ::1
      # first, but nginx only binds 0.0.0.0 (IPv4), so ::1 hits a closed socket.
      test: ["CMD-SHELL", "wget --no-check-certificate -qO- https://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
