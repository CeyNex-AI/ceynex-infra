# Shared by all three compose files (database, backend, frontend).
#
# Logs: json-file is Docker's default, but with no size limit; on a single VM a
# chatty container fills the disk every other container needs.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Ports: DB_PUBLISH_ADDR chooses where they listen on the host.
#   - Single VM (production since 2026-09-09): 127.0.0.1. The API reaches each
#     store by container name over the shared `ceynex` network, so the host
#     port only serves tools run on the VM itself (ops/backup.sh's Qdrant
#     snapshots, psql over an SSH tunnel). Nothing is exposed even if a
#     firewall rule ever opens: Docker-published ports bypass ufw, so the
#     binding is the only control that holds by itself.
#   - Three VMs: 0.0.0.0 (the default), because the backend VM dials this one
#     across the VPC, guarded by gcp/01_firewall_setup.sh's source-tag rule.
services:
  postgres:
    image: postgres:18.4
    container_name: ceynex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PUBLISH_ADDR:-0.0.0.0}:5432:5432"
    logging: *logging
    mem_limit: ${POSTGRES_MEM_LIMIT:-1g}
    volumes:
      # postgres:18 keeps its data in a version-named subdirectory and wants the
      # mount HERE, one level above. Mounting /var/lib/postgresql/data is what
      # crash-looped this container: the image finds data in an "unused
      # mount/volume" it will not adopt, and exits. See
      # https://github.com/docker-library/postgres/pull/1259
      - postgres_data:/var/lib/postgresql
    # No initdb hook. The schema lives in the ceynex-contracts package and is
    # applied by `make db-init` from ceynex-core, so one code path serves the
    # local dev stack and this VM. An initdb mount would only ever run on a
    # first-boot empty volume, which is not how this box gets updated.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: ceynex-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      # Match ceynex-core's dev stack. Without APOC a loader that runs locally
      # fails on this box, which is the worst possible place to find out.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Modest heap/pagecache sizing appropriate for a 15GB VM shared with Postgres+Redis.
      # Tune upward if Neo4j is the only thing on this box.
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 2G
    ports:
      # Neo4j Browser (HTTP): loopback only in every layout. Nothing dials it
      # but a person, through `ssh -L 7474:127.0.0.1:7474 -L 7687:127.0.0.1:7687`.
      - "127.0.0.1:7474:7474"
      - "${DB_PUBLISH_ADDR:-0.0.0.0}:7687:7687"   # Bolt (what the Python driver connects to)
    logging: *logging
    # Heap 2G + page cache 2G (above) + JVM and native overhead.
    mem_limit: ${NEO4J_MEM_LIMIT:-5g}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.0
    container_name: ceynex-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    environment:
      # The password reaches `command` through compose interpolation at parse
      # time, which does not put it inside the container. The healthcheck runs
      # inside, so it needs its own copy. REDISCLI_AUTH rather than `-a` keeps
      # the credential out of the process list.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "${DB_PUBLISH_ADDR:-0.0.0.0}:6379:6379"
    logging: *logging
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Policy-document vector store (deviation D10, ceynex-core/docs/ARCHITECTURE_DELTA.md).
  # Holds the chunked trade-policy corpus that `trade_economics` quotes from.
  # Which documents are eligible is decided in Cypher first (Neo4j), so this
  # answers "which passage" and never "which country" — see POLICY_RETRIEVAL.md.
  #
  # Reachable only from the backend VM: port 6333 must be added to the
  # allow-db-from-backend firewall rule, alongside 5432/7474/7687/6379.
  qdrant:
    image: qdrant/qdrant:v1.17.1
    container_name: ceynex-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    ports:
      - "${DB_PUBLISH_ADDR:-0.0.0.0}:6333:6333"
    logging: *logging
    mem_limit: ${QDRANT_MEM_LIMIT:-1g}
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # A bash TCP probe, not curl/wget and not the qdrant binary. The image
      # ships bash but neither curl nor wget (checked against v1.17.1), and the
      # binary has no health subcommand. Both obvious probes fail with
      # "executable file not found", which docker reports as unhealthy — so the
      # stack would wait forever on a service that is actually running.
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

# The one network all three projects join, created once per machine with
# `docker network create ceynex` (DEPLOY_ORDER.md). External, so a `down` in one
# project never removes it from under the other two.
networks:
  default:
    name: ceynex
    external: true

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  qdrant_data:
